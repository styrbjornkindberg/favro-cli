name: daily-digest
description: "Daily standup digest — standup overview + risk analysis in one view"
triggers:
  - manual
steps:
  - command: standup
    args:
      board: "{{board}}"
  # Both filters are the `cards list --filter` grammar, the only one there is (#95).
  # They were `due:overdue` and `blocked`. `due:` was an alias the deleted parser
  # minted for itself and it did mean "past its due date", so `due_date:overdue` is
  # that same question re-spelled in the one grammar — not the repair of a dead
  # filter. `blocked` named no field at all: it was swept into a title search for
  # the word, and it has been a plausible zero rows since #47 deleted the predicate.
  - command: query
    args:
      board: "{{board}}"
      query: "due_date:overdue"
    continueOnError: true
  # `blocked-by:true` is "carries any blocker edge at all" — an EDGE COUNT, not a
  # blocked state. Nothing clears a Favro edge when the blocker finishes, so a
  # digest must not read these as blocked work; `unblocked` is the predicate that
  # judges doneness and it is answered by `cards list --filter`, not here.
  - command: query
    args:
      board: "{{board}}"
      query: "blocked-by:true"
    continueOnError: true
variables:
  board:
    prompt: "Which board?"
    default: "{{scope.board}}"
