name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  test:
    name: Unit Tests & Coverage
    runs-on: ubuntu-latest

    strategy:
      matrix:
        # 22.x is what development actually runs on; 18/20 stay because
        # package.json declares engines.node ">=18.0.0". Adding an entry adds a
        # published check name — `Unit Tests & Coverage (22.x)` — so branch
        # protection has to be re-pinned or it guards two thirds of the matrix.
        node-version: [18.x, 20.x, 22.x]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests with coverage
        run: npx jest --coverage --no-verbose
        env:
          CI: true

      - name: Upload coverage reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report-node-${{ matrix.node-version }}
          path: coverage/

  integration-test:
    name: Integration Tests
    runs-on: ubuntu-latest
    # Only run when secrets are available (not on forks)
    if: github.repository == github.event.repository.full_name && github.actor != 'dependabot[bot]'

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # Requires repo secrets FAVRO_API_TOKEN and FAVRO_TEST_BOARD_ID (a
      # dedicated throwaway Favro board — the suite creates and deletes cards
      # on it). Without both, the run is announced as skipped rather than
      # passing quietly: the suite's own guards would skip every test anyway.
      - name: Run integration tests
        env:
          CI: true
          FAVRO_API_TOKEN: ${{ secrets.FAVRO_API_TOKEN }}
          FAVRO_TEST_BOARD_ID: ${{ secrets.FAVRO_TEST_BOARD_ID }}
        run: |
          if [ -z "$FAVRO_API_TOKEN" ] || [ -z "$FAVRO_TEST_BOARD_ID" ]; then
            echo "::warning title=Integration tests skipped::FAVRO_API_TOKEN / FAVRO_TEST_BOARD_ID are not configured — no integration coverage for this run."
            exit 0
          fi
          npx jest --config jest.integration.config.js --verbose

  typecheck:
    name: TypeScript Check
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # tsconfig.test.json is the root config minus the `**/*.test.ts` exclude
      # the build needs to keep dist/ clean — a superset of what `tsc --noEmit`
      # checked before #121, so it is one gate, not two.
      - name: TypeScript type check (source + tests)
        run: npm run typecheck

      # Meaningful as a gate only since #122: `name-cache` used to import the
      # two API classes that import it back, so the graph was never clean and a
      # check would have been permanently red. `--extensions ts` is load-bearing
      # — without it madge finds 0 files and passes for the wrong reason.
      - name: Import cycle check
        run: npm run check:cycles

      # A step here rather than its own job: `tsc` is already this job's tool,
      # so it reuses the checkout and `npm ci` instead of duplicating them.
      # Measured, so the ceiling is known: the same type error in `src/` fails
      # BOTH `npm run typecheck` and `npm run build`, because tsconfig.test.json
      # extends tsconfig.json and only widens `exclude` — the build's file set
      # is a subset. What this adds is the emit half `--noEmit` never runs (a
      # dist/ that does not compile is a known failure mode here) and a guard on
      # that subset relation: if the two configs ever diverge, the file only the
      # build sees is checked by this step and nothing else.
      - name: Build (emit dist/)
        run: npm run build
